name: Luna Avatar Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'luna_08_no_cape.png'
      - 'assets/**'
      - '.github/workflows/luna-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Luna-Avatar-Test-v0.4.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luna-Avatar-Test-v0.4.1
          path: Luna-Avatar-Test-v0.4.1.apk
          if-no-files-found: error
          retention-days: 14
