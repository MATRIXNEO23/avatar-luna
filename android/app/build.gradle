plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matrixneo.lunaavatartest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.matrixneo.lunaavatartest'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', "$buildDir/generated/lunaAssets"]
        }
    }
}

def syncLunaAssets = tasks.register('syncLunaAssets', Sync) {
    into "$buildDir/generated/lunaAssets"
    from('../..') {
        include 'index.html'
        include 'styles.css'
        include 'app.js'
        include 'luna_08_no_cape.png'
        include 'assets/**'
    }
}

tasks.named('preBuild').configure {
    dependsOn syncLunaAssets
}
